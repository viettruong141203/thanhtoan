<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>Bảng Điều Khiển</title>
  <!-- BUỘC TRÌNH DUYỆT CẬP NHẬT CSS MỚI BẰNG ?v=5 -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <!-- ===================================== -->
  <!-- TAB 1: DASHBOARD GIAO DỊCH            -->
  <!-- ===================================== -->
  <div id="tab-transactions" class="tab-view active">
    <div class="container">
      
      <!-- HEADER DASHBOARD -->
      <div class="dashboard-header">
        <div>
          <span class="welcome-text">Xin chào, Admin 👋</span>
          <h1 class="dash-title">Tổng quan</h1>
        </div>
        <div class="dash-avatar">A</div>
      </div>
      
      <!-- KHỐI THANH CÔNG CỤ -->
      <div class="action-card">
        <div class="top-row">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Tìm mã giao dịch..." oninput="onSearchInput()">
          </div>
          <button class="add-btn" onclick="openAddModal()">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>

        <div class="filter-wrapper">
          <button class="filter-btn active" onclick="setFilter('All', this)">Tất cả</button>
          <button class="filter-btn" onclick="setFilter('Chờ', this)">Đang xử lí</button>
          <button class="filter-btn" onclick="setFilter('Đã', this)">Hoàn tất</button>
          <button class="filter-btn" onclick="setFilter('Thất', this)">Thất bại</button>
        </div>
      </div>

      <div class="list-container" id="deckView">
        <div style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 600; font-size: 15px;">Đang tải dữ liệu...</div>
      </div>
      
      <div class="pagination">
        <button class="page-btn" id="prevBtn" onclick="changePage(-1)">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="page-info" id="pageInfo">1 / 1</span>
        <button class="page-btn" id="nextBtn" onclick="changePage(1)">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===================================== -->
  <!-- TAB 2: NGÂN HÀNG (DẠNG THẺ ATM CAO CẤP)-->
  <!-- ===================================== -->
  <div id="tab-banks" class="tab-view">
    <div class="container" style="padding-top: max(16px, env(safe-area-inset-top));">
      <div class="dashboard-header" style="padding-bottom: 24px;">
        <div>
          <span class="welcome-text">Quản lý</span>
          <h1 class="dash-title">Tài khoản</h1>
        </div>
        <button class="add-btn" onclick="openBankForm()" style="width: 44px; height: 44px; border-radius: 14px;">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </div>
      
      <div id="bankCardsContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 600;">Đang tải danh sách...</div>
      </div>
    </div>
  </div>

  <!-- ===================================== -->
  <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG            -->
  <!-- ===================================== -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('transactions', this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      <span>Giao dịch</span>
    </div>
    <div class="nav-item" onclick="switchTab('banks', this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" ry="4"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
      <span>Ngân hàng</span>
    </div>
  </div>

  <!-- ===================================== -->
  <!-- MODAL CHỨA CÁC FORM                   -->
  <!-- ===================================== -->
  <div class="modal-overlay" id="mainModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      
      <!-- TẠO GIAO DỊCH -->
      <div class="add-view" id="view-add">
        <h3 class="add-title">Tạo giao dịch</h3>
        <div class="add-sub">Nhập số tiền để tiếp tục</div>
        <div class="input-group">
          <button class="step-btn" onclick="adjustAmount(-1000)">-</button>
          <input type="text" id="amount" inputmode="numeric" placeholder="0" oninput="formatInput(this)">
          <button class="step-btn" onclick="adjustAmount(1000)">+</button>
        </div>
        <button class="btn-primary" id="submitBtn" onclick="submitForm()">Xác nhận</button>
        <div class="loader" id="loadingBtn"></div>
        <div id="message" style="text-align:center; margin-top:14px; font-size:14px; font-weight:700;"></div>
      </div>

      <!-- HÓA ĐƠN CHI TIẾT -->
      <div class="receipt-view" id="view-receipt" style="padding: 24px 20px;">
        <div class="receipt-card">
          <div class="receipt-header">
            <div class="receipt-title">Thông tin giao dịch</div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Mã giao dịch</span>
            <span class="detail-value mono" id="rc-id" style="font-family: monospace; font-size: 15px;"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Thời gian tạo</span>
            <span class="detail-value" id="rc-time"></span>
          </div>
          <div class="detail-row" id="row-paytime">
            <span class="detail-label">Hoàn tất lúc</span>
            <span class="detail-value" id="rc-paytime"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Số tiền</span>
            <span class="detail-value mono" style="color: var(--brand-primary); font-size: 18px; font-family: monospace;" id="rc-amount-row"></span>
          </div>
          <div class="detail-row" style="border-bottom: none; padding-bottom: 0;">
            <span class="detail-label">Trạng thái</span>
            <span class="status-badge" id="rc-status-text"></span>
          </div>
        </div>
        <button class="btn-primary" style="display: none; margin-top: 24px;" id="btnGoToPayment" onclick="openPaymentView()">Thanh toán ngay</button>
      </div>

      <!-- THÊM NGÂN HÀNG MỚI -->
      <div class="receipt-view" id="view-bank-form" style="padding: 32px 24px;">
        <h3 class="add-title" style="margin-bottom: 24px;">Thêm Ngân Hàng</h3>
        
        <div class="form-group">
          <label class="form-label">Chọn ngân hàng</label>
          <div class="bank-select-box" onclick="toggleBankList()">
            <div class="bank-select-left">
              <img id="selectedBankLogo" src="">
              <span id="selectedBankName">Nhấn để chọn...</span>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="bank-dropdown-list" id="bankDropdownList"></div>
          <input type="hidden" id="bankBinInput">
          <input type="hidden" id="bankNameInput">
        </div>

        <div class="form-group">
          <label class="form-label">Số tài khoản</label>
          <input type="text" class="form-input" id="bankAccInput" placeholder="Ví dụ: 0123456789" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label">Chủ tài khoản (Không dấu)</label>
          <input type="text" class="form-input uppercase" id="bankOwnerInput" placeholder="DINH VIET TRUONG" oninput="formatOwnerName(this)" autocomplete="off">
        </div>

        <button class="btn-primary" id="btnSaveBank" onclick="saveBankConfig()">Lưu cấu hình</button>
        <div class="loader" id="loaderSaveBank" style="margin-top:12px;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Đã sao chép!</div>
  
  <script src="script.js?v=5"></script>
</body>
</html>
