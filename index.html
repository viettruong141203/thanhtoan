<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>Quản Lý Thanh Toán</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="session-timer" id="sessionTimer" style="display: none;">
    Phiên: <span id="timeRemaining">05:00</span>
  </div>

  <div class="container">
    <div class="sticky-header">
      <div class="top-row">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Tìm mã giao dịch..." oninput="onSearchInput()">
        </div>
        
        <!-- Nút icon mở quản lý ngân hàng -->
        <button class="bank-mgr-btn" onclick="openBankManager()" title="Quản lý ngân hàng">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
        </button>

        <button class="add-btn" onclick="openAddModal()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19"></path></svg>
        </button>
      </div>

      <div class="filter-wrapper">
        <button class="filter-btn active" onclick="setFilter('All', this)">Tất cả</button>
        <button class="filter-btn" onclick="setFilter('Chờ', this)">Đang xử lí</button>
        <button class="filter-btn" onclick="setFilter('Đã', this)">Hoàn tất</button>
        <button class="filter-btn" onclick="setFilter('Thất', this)">Thất bại</button>
      </div>
    </div>

    <div class="list-container" id="deckView">
      <div style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 500; font-size: 14px;">Đang tải...</div>
    </div>
    
    <div class="pagination">
      <button class="page-btn" id="prevBtn" onclick="changePage(-1)">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-info" id="pageInfo">1 / 1</span>
      <button class="page-btn" id="nextBtn" onclick="changePage(1)">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="mainModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      
      <!-- 1. VIEW NHẬP TIỀN -->
      <div class="add-view" id="view-add">
        <h3 class="add-title">Tạo giao dịch</h3>
        <div class="add-sub">Nhập số tiền để tiếp tục</div>
        <div class="input-group">
          <button class="step-btn" onclick="adjustAmount(-1000)">-</button>
          <input type="text" id="amount" inputmode="numeric" placeholder="0" oninput="formatInput(this)">
          <button class="step-btn" onclick="adjustAmount(1000)">+</button>
        </div>
        <button class="btn-primary" id="submitBtn" onclick="submitForm()">Xác nhận</button>
        <div class="loader" id="loadingBtn"></div>
        <div id="message" style="text-align:center; margin-top:14px; font-size:14px; font-weight:600;"></div>
      </div>

      <!-- 2. BIÊN LAI -->
      <div class="receipt-view" id="view-receipt">
        <div class="receipt-card">
          <div class="receipt-header">
            <div class="receipt-title">Thông tin giao dịch</div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Mã giao dịch</span>
            <span class="detail-value mono" id="rc-id"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Thời gian tạo</span>
            <span class="detail-value" id="rc-time"></span>
          </div>
          <div class="detail-row" id="row-paytime">
            <span class="detail-label">Hoàn tất lúc</span>
            <span class="detail-value" id="rc-paytime"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Số tiền</span>
            <span class="detail-value mono" style="color: var(--brand-primary); font-size: 16px;" id="rc-amount-row"></span>
          </div>
          <div class="detail-row" style="border-bottom: none; padding-bottom: 0;">
            <span class="detail-label">Trạng thái</span>
            <span class="status-text-only" id="rc-status-text"></span>
          </div>
        </div>
        <button class="btn-primary" style="display: none; margin-top: 20px;" id="btnGoToPayment" onclick="openPaymentView()">Thanh toán ngay</button>
      </div>

      <!-- 3. VIEW BẢNG QUẢN LÝ NGÂN HÀNG -->
      <div class="receipt-view" id="view-bank-mgr" style="padding: 32px 20px;">
        <h3 class="add-title" style="margin-bottom: 20px;">Tài khoản nhận tiền</h3>
        <div class="bank-table-card">
          <table class="bank-table">
            <thead>
              <tr>
                <th>Ngân hàng</th>
                <th>Tài khoản</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="bankTableBody">
              <tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Đang tải dữ liệu...</td></tr>
            </tbody>
          </table>
        </div>
        <button class="btn-primary" onclick="openBankForm()">+ Thêm tài khoản mới</button>
      </div>

      <!-- 4. VIEW FORM THÊM MỚI NGÂN HÀNG -->
      <div class="receipt-view" id="view-bank-form" style="padding: 32px 24px;">
        <h3 class="add-title" style="margin-bottom: 20px;">Thêm Ngân Hàng</h3>
        
        <div class="form-group">
          <label class="form-label">Chọn ngân hàng</label>
          <div class="bank-select-box" onclick="toggleBankList()">
            <div class="bank-select-left">
              <img id="selectedBankLogo" src="">
              <span id="selectedBankName">Chọn từ danh sách...</span>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="bank-dropdown-list" id="bankDropdownList"></div>
          <input type="hidden" id="bankBinInput">
          <input type="hidden" id="bankNameInput">
        </div>

        <div class="form-group">
          <label class="form-label">Số tài khoản</label>
          <input type="text" class="form-input" id="bankAccInput" placeholder="Nhập số tài khoản" inputmode="numeric">
        </div>

        <div class="form-group">
          <label class="form-label">Chủ tài khoản (Không dấu)</label>
          <input type="text" class="form-input uppercase" id="bankOwnerInput" placeholder="DINH VIET TRUONG" oninput="formatOwnerName(this)">
        </div>

        <button class="btn-primary" id="btnSaveBank" onclick="saveBankConfig()">Lưu ngân hàng</button>
        <div class="loader loader-blue" id="loaderSaveBank" style="margin-top:12px;"></div>
      </div>

    </div>
  </div>

  <div class="toast" id="toastMsg">Đã sao chép!</div>
  <script src="script.js"></script>
</body>
</html>
