<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>Đăng nhập Hệ thống</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      </div>
      <h2 class="login-title">Hệ thống Quản trị</h2>
      <p class="login-desc">Xác nhận danh tính để truy cập hệ thống</p>
      
      <div id="loginStep1">
        <div class="admin-badge">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>dvtruong141203@gmail.com</span>
        </div>
        <button class="btn-primary" id="btnSendOtp" onclick="sendOtp()" style="border-radius: 16px;">
          <span>Nhận mã đăng nhập</span>
          <div class="loader" id="loaderSend"></div>
        </button>
      </div>

      <div id="loginStep2" style="display:none;">
        <input type="text" id="otpInput" class="otp-input" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        <button class="btn-primary" id="btnVerifyOtp" onclick="verifyOtp()" style="border-radius: 16px;">
          <span>Xác nhận mã</span>
          <div class="loader" id="loaderVerify"></div>
        </button>
        <button class="btn-auth-outline" onclick="backToStep1()">Gửi lại mã</button>
      </div>
      <div id="loginMsg" class="login-msg"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyyun_QUMFygjjOUbPLLE9mJJQdLGOXPV8OvXlh-JM8Napr4Cx8tBRccHMlSCZ_vvBb/exec";
    const ADMIN_EMAIL = "dvtruong141203@gmail.com";

    function checkAuth() {
      const authExpiry = localStorage.getItem('auth_expiry');
      if (authExpiry && Date.now() < parseInt(authExpiry)) {
        window.location.replace("./index.html"); 
      }
    }
    window.onload = checkAuth;

    function sendOtp() {
      const btn = document.getElementById('btnSendOtp'), loader = document.getElementById('loaderSend'), msg = document.getElementById('loginMsg');
      msg.innerText = ""; btn.querySelector('span').style.display = 'none'; loader.style.display = 'block';
      fetch(`${API_URL}?action=sendOTP&email=${encodeURIComponent(ADMIN_EMAIL)}&t=${Date.now()}`)
        .then(res => res.json()).then(res => {
          btn.querySelector('span').style.display = 'inline'; loader.style.display = 'none';
          if(res.success) {
            document.getElementById('loginStep1').style.display = 'none';
            document.getElementById('loginStep2').style.display = 'block';
            document.getElementById('otpInput').focus();
            msg.style.color = "var(--status-success)"; msg.innerText = res.message;
          } else { msg.style.color = "var(--status-failed)"; msg.innerText = res.message; }
        }).catch(err => {
          btn.querySelector('span').style.display = 'inline'; loader.style.display = 'none';
          msg.style.color = "var(--status-failed)"; msg.innerText = "Lỗi mạng khi gửi OTP!";
        });
    }

    function verifyOtp() {
      const otp = document.getElementById('otpInput').value.trim(), btn = document.getElementById('btnVerifyOtp'), loader = document.getElementById('loaderVerify'), msg = document.getElementById('loginMsg');
      if(otp.length !== 6) { msg.style.color = "var(--status-failed)"; msg.innerText = "Vui lòng nhập 6 số OTP"; return; }
      msg.innerText = ""; btn.querySelector('span').style.display = 'none'; loader.style.display = 'block';
      fetch(`${API_URL}?action=verifyOTP&otp=${encodeURIComponent(otp)}&t=${Date.now()}`)
        .then(res => res.json()).then(res => {
          if(res.success) {
            localStorage.setItem('auth_expiry', Date.now() + (5 * 60 * 1000));
            window.location.replace("./index.html"); 
          } else {
            btn.querySelector('span').style.display = 'inline'; loader.style.display = 'none';
            msg.style.color = "var(--status-failed)"; msg.innerText = res.message;
          }
        }).catch(err => {
          btn.querySelector('span').style.display = 'inline'; loader.style.display = 'none';
          msg.style.color = "var(--status-failed)"; msg.innerText = "Lỗi mạng!";
        });
    }

    function backToStep1() {
      document.getElementById('loginStep2').style.display = 'none'; document.getElementById('loginStep1').style.display = 'block';
      document.getElementById('otpInput').value = ''; document.getElementById('loginMsg').innerText = '';
    }
  </script>
</body>
</html>
